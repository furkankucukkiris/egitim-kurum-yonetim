name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bu workflow hiçbir GitHub secret'ı kullanmıyor. db-integration ve e2e
# job'ları tamamen `supabase start` ile açılan GEÇİCİ, yerel Docker
# Supabase örneğine karşı çalışıyor — bu örneğin anon/service_role
# anahtarları o an için üretilen, yalnızca o çalıştırmada var olan
# değerlerdir; workflow dosyasına asla yazılmazlar, `supabase status`
# çıktısından çalışma zamanında $GITHUB_ENV'e akıtılırlar.

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit & Component Testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Placeholder değerler — gerçek secret DEĞİL. Uygulamanın hiçbir
      # sayfası build zamanında Supabase'e ağ çağrısı yapmıyor (tüm
      # route'lar dinamik/ƒ, statik üretim yok); next.config.ts'deki
      # CSP header'ı için URL'nin biçimsel olarak var olması yeterli.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

  db-integration:
    name: Migration Doğrulama + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # ubuntu-latest runner'da Docker hazır geliyor — supabase CLI
      # bunu kullanarak yerel bir Postgres + PostgREST + Auth yığını
      # ayağa kaldırıyor.
      - name: Yerel Supabase'i başlat
        run: npx supabase start

      # CI görevi #6: migration'ların temiz bir veritabanına sıfırdan
      # ve hatasız uygulandığının doğrulanması.
      - name: db reset (migration doğrulama)
        run: npx supabase db reset

      # supabase/tests/database/*.test.sql — RPC/RLS/transaction/kurum
      # izolasyonu pgTAP paketinin tamamı.
      - name: pgTAP testleri
        run: npx supabase test db

  e2e:
    name: E2E (admin + öğretmen temel akışları)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    env:
      # Supabase'ten gelen 3 değişkenden farklı olarak bu, Supabase'e
      # özgü değil — saf uygulama görüntü ayarı. `webServer` (next build
      # && next start → NODE_ENV=production) src/instrumentation.ts
      # üzerinden bunun varlığını zorunlu kılıyor (bkz.
      # src/lib/env-validation.ts); burada tanımlanmazsa sunucu açılışta
      # "eksik: NEXT_PUBLIC_INSTITUTION_NAME" hatasıyla çöker.
      NEXT_PUBLIC_INSTITUTION_NAME: "E2E Test Kurumu"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium

      - name: Yerel Supabase'i başlat
        run: npx supabase start

      # E2E, `has_any_organization()`'ın false döndüğü, hiçbir kurum/profil
      # olmayan gerçekten boş bir sisteme ihtiyaç duyuyor — seed.sql'in
      # oluşturduğu demo kurum bu koşulu bozup admin'i /kurulum yerine
      # /hesap-erisimi'ne düşürüyordu (bkz. e2e/global-setup.ts'teki
      # doğrulama). Seed dosyasının kendisi (yerel geliştirme + pgTAP için
      # hâlâ gerekli) değiştirilmiyor; yalnızca bu job'da çalıştırılmıyor.
      - name: Migration'ları seed olmadan uygula
        run: npx supabase db reset --no-seed

      # `supabase status -o env` bu çalıştırmaya özgü, geçici anahtarları
      # üretir ve doğrudan uygulamanın beklediği değişken adlarına
      # eşler (--override-name) — hiçbir sabit/secret yazılmıyor. İlk
      # çalıştırmada anahtar yolları (api.url vb.) uyuşmazsa
      # `npx supabase status -o json` ile gerçek alan adları kontrol
      # edilip burası güncellenebilir.
      - name: Ortam değişkenlerini yerel Supabase'ten al
        run: |
          npx supabase status -o json \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"

      # `supabase status -o json --override-name` alan adı eşleşmesi
      # sessizce başarısız olursa (ör. CLI sürümü fieldKey'leri
      # değiştirirse), üç değişkenden biri boş kalır ve Next.js build'i
      # bunu asla loglamadan derler — sonuç, E2E'nin çok daha sonra,
      # anlamsız bir "heading bulunamadı" timeout'uyla başarısız olması
      # olur. Burada erken ve açıkça patlatıyoruz.
      - name: Ortam değişkenlerini doğrula
        run: |
          missing=()
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && missing+=("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::supabase status'tan şu ortam değişkenleri alınamadı: ${missing[*]}"
            exit 1
          fi

      - name: E2E testleri (Playwright)
        run: npm run test:e2e

      - name: Playwright raporunu yükle (başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
