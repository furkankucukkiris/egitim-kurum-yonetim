name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Her Pazartesi 03:00 UTC — push/PR aralarında da yeni CodeQL kural
    # setleriyle taranmış olsun.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: CodeQL Analiz
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v7

      - name: CodeQL'i başlat
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: CodeQL analizini çalıştır
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
